<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paste Guard 데모</title>
<style>
  :root { --bg: #f3f4f6; --panel: #fff; --line: #e5e7eb; --muted: #6b7280; --ink: #111827; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px system-ui, "Malgun Gothic", sans-serif; background: var(--bg); color: var(--ink); }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 16px; }
  .samples { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .samples button { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
  .chat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  #feed { min-height: 220px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  #feed .empty { color: var(--muted); text-align: center; margin: auto; }
  .msg img { max-width: 100%; border-radius: 8px; border: 1px solid var(--line); }
  .composer { border-top: 1px solid var(--line); padding: 12px; }
  #attach { display: flex; gap: 8px; flex-wrap: wrap; }
  #attach img { height: 90px; border-radius: 6px; border: 1px solid var(--line); }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  #input { flex: 1; min-height: 40px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; outline: none; }
  #input:empty::before { content: attr(data-ph); color: var(--muted); }
  #send { padding: 0 16px; border-radius: 8px; border: 0; background: var(--ink); color: #fff; cursor: pointer; }
  #status { color: var(--muted); font-size: 13px; margin-top: 12px; }
</style>
</head>
<body>
<main>
  <h1>Paste Guard 데모</h1>
  <p class="lead">아래 입력창에 화면 캡처를 붙여넣거나(Ctrl+V) 샘플 버튼을 누르세요. 이 입력창은 일반 메신저처럼 붙여넣은 이미지를 첨부로 받습니다.</p>
  <div class="samples">
    <button data-s="lms_grades">샘플: 수업 과제 현황</button>
    <button data-s="dev_env">샘플: 개발 설정 파일</button>
    <button data-s="chat_share">샘플: 단체방 공지</button>
  </div>
  <div class="chat">
    <div id="feed"><div class="empty">아직 보낸 메시지가 없습니다</div></div>
    <div class="composer">
      <div id="attach"></div>
      <div class="row">
        <div id="input" contenteditable="true" data-ph="메시지 입력 · 이미지 붙여넣기"></div>
        <button id="send">보내기</button>
      </div>
    </div>
  </div>
  <div id="status"></div>
</main>
<script>
  // 이 페이지의 입력창은 Paste Guard를 모르는 일반 사이트처럼 동작한다
  const input = document.getElementById("input");
  const attach = document.getElementById("attach");
  const feed = document.getElementById("feed");
  let files = [];

  input.addEventListener("paste", (e) => {
    const imgs = [...e.clipboardData.files].filter((f) => f.type.startsWith("image/"));
    if (!imgs.length) return;
    e.preventDefault();
    for (const f of imgs) {
      files.push(f);
      const img = document.createElement("img");
      img.src = URL.createObjectURL(f);
      attach.appendChild(img);
    }
  });

  document.getElementById("send").onclick = () => {
    if (!files.length && !input.textContent.trim()) return;
    feed.querySelector(".empty")?.remove();
    const msg = document.createElement("div");
    msg.className = "msg";
    if (input.textContent.trim()) msg.append(input.textContent.trim());
    for (const f of files) {
      const img = document.createElement("img");
      img.src = URL.createObjectURL(f);
      msg.appendChild(img);
    }
    feed.appendChild(msg);
    files = [];
    attach.innerHTML = "";
    input.textContent = "";
  };

  // 샘플 버튼: 이미지를 클립보드에서 붙여넣은 것처럼 paste 이벤트를 일으킨다
  document.querySelectorAll("[data-s]").forEach((b) => {
    b.onclick = async () => {
      const blob = await (await fetch(`samples/${b.dataset.s}.png`)).blob();
      const dt = new DataTransfer();
      dt.items.add(new File([blob], `${b.dataset.s}.png`, { type: "image/png" }));
      input.focus();
      input.dispatchEvent(new ClipboardEvent("paste", { clipboardData: dt, bubbles: true, cancelable: true }));
    };
  });

  fetch("/health").then((r) => r.json()).then((h) => {
    document.getElementById("status").textContent =
      `점검 서버 연결됨 · AI 문맥 판정: ${h.llm ?? "꺼짐(LLM 미설정, 규칙만 사용)"} · 확장이 설치돼 있으면 확장이, 아니면 이 페이지에 넣은 스크립트가 붙여넣기를 점검합니다.`;
  });
</script>
<!-- 확장 없이 써 볼 수 있게 같은 콘텐츠 스크립트를 넣는다. 확장이 있으면 스크립트가 알아서 한 번만 동작한다 -->
<script>window.PASTE_GUARD_SERVER = location.origin;</script>
<script src="/ext/content.js"></script>
</body>
</html>
